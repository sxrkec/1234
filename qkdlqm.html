<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>블록 다운 — 테트리스</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --panel: #181818;
      --line: #282828;
      --muted: #b3b3b3;
      --text: #ffffff;
      --green: #1ed760;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SpotifyMixUI", "CircularSp", "Noto Sans KR", Arial, "Malgun Gothic", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 18px 30px;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    button { font: inherit; color: inherit; }
    .app { width: min(100%, 790px); position: relative; }
    header { text-align: center; margin-bottom: 24px; }
    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .16em; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.045em; font-weight: 800; }
    h1 span { color: var(--text); }
    .subtitle { color: var(--muted); margin: 8px 0 0; font-size: 13px; }
    .layout { display: grid; grid-template-columns: 150px 300px 150px; gap: 18px; align-items: start; justify-content: center; }
    .side { display: grid; gap: 12px; }
    .card {
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 8px 8px rgba(0,0,0,.3);
    }
    .label { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 9px; font-weight: 700; }
    .score { margin-top: 8px; font-size: 27px; font-variant-numeric: tabular-nums; letter-spacing: -.04em; font-weight: 800; }
    .best-score { color: var(--text); }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .stat-row strong { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
    .preview-card { min-height: 127px; }
    .preview { display: block; width: 100%; height: 74px; margin-top: 7px; }
    .board-wrap { position: relative; border-radius: 8px; padding: 6px; background: #181818; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .board-wrap::before { content:""; position:absolute; inset:0; border-radius:8px; border:1px solid #282828; pointer-events:none; }
    #board { display:block; width:300px; height:600px; border-radius:4px; background:#121212; }
    .overlay { position:absolute; inset:6px; border-radius:4px; display:grid; place-items:center; background:rgba(18, 18, 18, .86); text-align:center; padding:20px; }
    .overlay[hidden] { display:none; }
    .overlay-box { max-width:235px; }
    .overlay-kicker { color:var(--muted); font-size:10px; letter-spacing:.16em; font-weight:700; }
    .overlay h2 { margin:9px 0 6px; font-size:27px; letter-spacing:-.04em; }
    .overlay p { margin:0 0 18px; font-size:12px; line-height:1.65; color:var(--muted); }
    .primary, .icon-button, .control-button {
      border:1px solid transparent;
      background:#1f1f1f;
      border-radius:9999px; cursor:pointer; transition:transform .12s, border-color .12s, background .12s;
    }
    .primary { padding:12px 24px; background:var(--green); color:#000000; font-size:12px; font-weight:800; border:0; box-shadow:none; }
    .primary:hover { transform:scale(1.04); background:#3be477; }
    .icon-button { width:36px; height:36px; display:grid; place-items:center; color:#ffffff; }
    .icon-button:hover, .control-button:hover { background:#333333; }
    button:active { transform:scale(.96); }
    button:focus-visible { outline:2px solid var(--green); outline-offset:3px; }
    .board-toolbar { display:flex; justify-content:space-between; align-items:center; margin:0 2px 9px; }
    .live { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:10px; letter-spacing:.1em; font-weight:700; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:#535353; }
    .live-dot.on { background:var(--green); box-shadow:0 0 8px rgba(30,215,96,.5); }
    .toolbar-actions { display:flex; gap:6px; }
    .hold-card { min-height:127px; }
    .hold-card .preview { height:74px; }
    .tips { font-size:11px; line-height:1.9; color:var(--muted); }
    kbd { display:inline-grid; place-items:center; min-width:21px; padding:1px 5px; border:0; border-radius:9999px; background:#282828; color:#ffffff; font:600 10px ui-monospace,monospace; margin-right:3px; }
    .tip-line { display:flex; justify-content:space-between; gap:4px; }
    .tip-line span:last-child { text-align:right; color:#ffffff; }
    .controls { display:none; }
    footer { margin-top:19px; text-align:center; color:#6a6a6a; font-size:10px; }
    @media (max-width: 700px) {
      body { padding:20px 12px 28px; }
      header { margin-bottom:18px; }
      .layout { grid-template-columns: minmax(0, 300px); gap:10px; }
      .board-column { grid-row:1; }
      .side-left { grid-row:2; grid-template-columns:1fr 1fr; }
      .side-right { grid-row:3; grid-template-columns:1fr 1fr; }
      .card { padding:12px; border-radius:8px; }
      .score { font-size:22px; }
      .preview-card, .hold-card { min-height:105px; }
      .preview, .hold-card .preview { height:55px; }
      .tips-card { grid-column:span 2; }
      #board { width:min(300px, calc(100vw - 38px)); height:auto; aspect-ratio:1/2; }
      .board-wrap { width:fit-content; margin:auto; }
      .controls { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:12px; touch-action:manipulation; }
      .control-button { min-height:44px; font-size:17px; font-weight:800; color:#ffffff; }
      .control-button small { display:block; font-size:8px; font-weight:700; color:#b3b3b3; letter-spacing:.04em; }
      .control-button.wide { grid-column:span 2; font-size:12px; }
      footer { margin-top:14px; }
    }
    @media (max-width: 360px) { #board { width:calc(100vw - 34px); } .layout { gap:8px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">A LITTLE BLOCK OF FOCUS</div>
      <h1>블록 <span>다운</span></h1>
      <p class="subtitle">차곡차곡 쌓고, 한 줄씩 시원하게 지워보세요.</p>
    </header>

    <section class="layout" aria-label="테트리스 게임">
      <aside class="side side-left">
        <div class="card">
          <div class="label">점수</div><div class="score" id="score">0</div>
          <div class="stat-row"><span>지운 줄</span><strong id="lines">0</strong></div>
          <div class="stat-row"><span>레벨</span><strong id="level">1</strong></div>
        </div>
        <div class="card">
          <div class="label">최고 점수</div><div class="score best-score" id="best">0</div>
          <div class="stat-row"><span>플레이 시간</span><strong id="time">00:00</strong></div>
        </div>
        <div class="card hold-card">
          <div class="label">홀드 <span style="letter-spacing:0">·</span> C</div>
          <canvas class="preview" id="hold" width="140" height="74" aria-label="홀드 블록"></canvas>
        </div>
      </aside>

      <div class="board-column">
        <div class="board-toolbar">
          <div class="live"><span class="live-dot" id="liveDot"></span><span id="status">준비</span></div>
          <div class="toolbar-actions">
            <button class="icon-button" id="pauseBtn" aria-label="일시정지" title="일시정지 (P)">Ⅱ</button>
            <button class="icon-button" id="restartBtn" aria-label="새 게임" title="새 게임">↻</button>
          </div>
        </div>
        <div class="board-wrap">
          <canvas id="board" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
          <div class="overlay" id="overlay">
            <div class="overlay-box">
              <div class="overlay-kicker" id="overlayKicker">READY WHEN YOU ARE</div>
              <h2 id="overlayTitle">시작해볼까요?</h2>
              <p id="overlayText">블록을 움직여 빈틈없이 쌓고<br>줄을 완성해보세요.</p>
              <button class="primary" id="startBtn">게임 시작</button>
            </div>
          </div>
        </div>
        <div class="controls" aria-label="터치 조작">
          <button class="control-button" data-action="left" aria-label="왼쪽">←<small>이동</small></button>
          <button class="control-button" data-action="rotate" aria-label="회전">↻<small>회전</small></button>
          <button class="control-button" data-action="right" aria-label="오른쪽">→<small>이동</small></button>
          <button class="control-button" data-action="down" aria-label="아래">↓<small>내리기</small></button>
          <button class="control-button" data-action="drop" aria-label="하드 드롭">⬇<small>내리꽂기</small></button>
          <button class="control-button wide" data-action="hold" aria-label="홀드">홀드</button>
          <button class="control-button wide" data-action="pause" aria-label="일시정지">Ⅱ　일시정지</button>
        </div>
      </div>

      <aside class="side side-right">
        <div class="card preview-card">
          <div class="label">다음 블록</div>
          <canvas class="preview" id="next" width="140" height="74" aria-label="다음 블록"></canvas>
        </div>
        <div class="card tips-card">
          <div class="label" style="margin-bottom:8px">조작 방법</div>
          <div class="tips">
            <div class="tip-line"><span><kbd>←</kbd><kbd>→</kbd></span><span>좌우 이동</span></div>
            <div class="tip-line"><span><kbd>↑</kbd></span><span>회전</span></div>
            <div class="tip-line"><span><kbd>↓</kbd></span><span>빠르게 내리기</span></div>
            <div class="tip-line"><span><kbd>Space</kbd></span><span>한 번에 내리기</span></div>
            <div class="tip-line"><span><kbd>C</kbd></span><span>블록 보관</span></div>
            <div class="tip-line"><span><kbd>P</kbd></span><span>일시정지</span></div>
          </div>
        </div>
      </aside>
    </section>
    <footer>키보드와 터치 모두 지원해요</footer>
  </main>

  <script>
    (() => {
      const COLS = 10, ROWS = 20, CELL = 30;
      const SHAPES = {
        I: [[1,1,1,1]],
        O: [[1,1],[1,1]],
        T: [[0,1,0],[1,1,1]],
        S: [[0,1,1],[1,1,0]],
        Z: [[1,1,0],[0,1,1]],
        J: [[1,0,0],[1,1,1]],
        L: [[0,0,1],[1,1,1]]
      };
      const COLORS = { I:'#59d9e8', O:'#f6cb62', T:'#ad8aff', S:'#6ee3a2', Z:'#ff7288', J:'#719bff', L:'#ff9c68' };
      const boardCanvas = document.getElementById('board');
      const ctx = boardCanvas.getContext('2d');
      const nextCanvas = document.getElementById('next');
      const holdCanvas = document.getElementById('hold');
      const overlay = document.getElementById('overlay');
      let grid, current, bag = [], queue = [], held = null, canHold = true;
      let score = 0, lines = 0, level = 1, best = Number(localStorage.getItem('block-down-best') || 0);
      let state = 'ready', lastTime = 0, dropCounter = 0, elapsed = 0, startedAt = 0, animationId = 0;

      const el = (id) => document.getElementById(id);
      el('best').textContent = best.toLocaleString('ko-KR');

      function refillBag() {
        const types = Object.keys(SHAPES);
        for (let i = types.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [types[i], types[j]] = [types[j], types[i]];
        }
        bag.push(...types);
      }
      function takeType() { if (!bag.length) refillBag(); return bag.shift(); }
      function matrixFor(type) { return SHAPES[type].map(row => row.slice()); }
      function makePiece(type = takeType()) {
        const matrix = matrixFor(type);
        return { type, matrix, x: Math.floor((COLS - matrix[0].length) / 2), y: 0 };
      }
      function fillQueue() { while (queue.length < 5) queue.push(takeType()); }
      function resetGame() {
        grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
        bag = []; queue = []; held = null; canHold = true;
        score = 0; lines = 0; level = 1; elapsed = 0; dropCounter = 0;
        fillQueue(); spawn(); updateStats(); draw(); drawPreviews();
      }
      function spawn() {
        fillQueue();
        current = makePiece(queue.shift());
        fillQueue();
        if (collides(current, 0, 0, current.matrix)) endGame();
        drawPreviews();
      }
      function collides(piece, dx, dy, matrix) {
        for (let y = 0; y < matrix.length; y++) for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const nx = piece.x + x + dx, ny = piece.y + y + dy;
          if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && grid[ny][nx])) return true;
        }
        return false;
      }
      function move(dx, dy) {
        if (state !== 'playing' || !current) return false;
        if (!collides(current, dx, dy, current.matrix)) {
          current.x += dx; current.y += dy; draw(); return true;
        }
        if (dy > 0) lockPiece();
        return false;
      }
      function rotateMatrix(matrix, dir = 1) {
        const rotated = matrix[0].map((_, i) => matrix.map(row => row[i]));
        if (dir > 0) rotated.forEach(row => row.reverse()); else rotated.reverse();
        return rotated;
      }
      function rotate() {
        if (state !== 'playing' || !current) return;
        const rotated = rotateMatrix(current.matrix);
        for (const offset of [0, -1, 1, -2, 2]) {
          if (!collides(current, offset, 0, rotated)) { current.x += offset; current.matrix = rotated; draw(); return; }
        }
      }
      function hardDrop() {
        if (state !== 'playing' || !current) return;
        let distance = 0;
        while (!collides(current, 0, 1, current.matrix)) { current.y++; distance++; }
        score += distance * 2; lockPiece();
      }
      function holdPiece() {
        if (state !== 'playing' || !canHold || !current) return;
        const type = current.type;
        if (held) { current = makePiece(held); held = type; }
        else { held = type; spawn(); }
        canHold = false;
        if (collides(current, 0, 0, current.matrix)) { endGame(); return; }
        drawPreviews(); draw();
      }
      function lockPiece() {
        let toppedOut = false;
        current.matrix.forEach((row, y) => row.forEach((value, x) => {
          if (value) {
            const gy = current.y + y, gx = current.x + x;
            if (gy < 0) toppedOut = true; else grid[gy][gx] = current.type;
          }
        }));
        if (toppedOut) { endGame(); return; }
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
          if (grid[y].every(Boolean)) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); cleared++; y++; }
        }
        if (cleared) {
          const points = [0, 100, 300, 500, 800][cleared] || 0;
          score += points * level; lines += cleared;
          level = Math.floor(lines / 10) + 1;
        }
        canHold = true; updateStats(); spawn(); draw();
      }
      function updateStats() {
        el('score').textContent = score.toLocaleString('ko-KR');
        el('lines').textContent = lines;
        el('level').textContent = level;
        if (score > best) { best = score; localStorage.setItem('block-down-best', String(best)); el('best').textContent = best.toLocaleString('ko-KR'); }
      }
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${mins}:${secs}`;
      }
      function paintBlock(target, x, y, size, color, alpha = 1) {
        target.globalAlpha = alpha;
        target.fillStyle = color;
        target.fillRect(x + 1, y + 1, size - 2, size - 2);
        target.fillStyle = 'rgba(255,255,255,.22)';
        target.fillRect(x + 2, y + 2, size - 4, Math.max(2, size * .11));
        target.fillStyle = 'rgba(4,10,24,.2)';
        target.fillRect(x + 2, y + size - Math.max(4, size * .13), size - 4, Math.max(2, size * .1));
        target.strokeStyle = 'rgba(255,255,255,.18)'; target.lineWidth = 1;
        target.strokeRect(x + 1.5, y + 1.5, size - 3, size - 3);
        target.globalAlpha = 1;
      }
      function drawGrid() {
        ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
        ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
        for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, ROWS * CELL); ctx.stroke(); }
        for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL + .5); ctx.lineTo(COLS * CELL, y * CELL + .5); ctx.stroke(); }
        if (grid) grid.forEach((row, y) => row.forEach((type, x) => { if (type) paintBlock(ctx, x * CELL, y * CELL, CELL, COLORS[type]); }));
      }
      function drawPiece(piece, alpha = 1, ghost = false) {
        piece.matrix.forEach((row, y) => row.forEach((value, x) => {
          if (!value) return;
          const px = (piece.x + x) * CELL, py = (piece.y + y) * CELL;
          if (py >= 0) {
            if (ghost) { ctx.globalAlpha = alpha; ctx.strokeStyle = COLORS[piece.type]; ctx.lineWidth = 2; ctx.strokeRect(px + 4, py + 4, CELL - 8, CELL - 8); ctx.globalAlpha = 1; }
            else paintBlock(ctx, px, py, CELL, COLORS[piece.type], alpha);
          }
        }));
      }
      function draw() {
        drawGrid();
        if (!current) return;
        const ghost = {...current, matrix: current.matrix};
        while (!collides(ghost, 0, 1, ghost.matrix)) ghost.y++;
        drawPiece(ghost, .45, true); drawPiece(current);
      }
      function drawPreview(canvas, type) {
        const c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height);
        if (!type) return;
        const matrix = SHAPES[type], size = 19;
        const width = matrix[0].length * size, height = matrix.length * size;
        const ox = Math.floor((canvas.width - width) / 2), oy = Math.floor((canvas.height - height) / 2);
        matrix.forEach((row, y) => row.forEach((value, x) => { if (value) paintBlock(c, ox + x * size, oy + y * size, size, COLORS[type]); }));
      }
      function drawPreviews() { drawPreview(nextCanvas, queue[0]); drawPreview(holdCanvas, held); }
      function showOverlay(kicker, title, text, button) {
        el('overlayKicker').textContent = kicker; el('overlayTitle').textContent = title;
        el('overlayText').innerHTML = text; el('startBtn').textContent = button; overlay.hidden = false;
      }
      function setState(next) {
        state = next;
        const names = { ready:'준비', playing:'플레이 중', paused:'일시정지', over:'게임 종료' };
        el('status').textContent = names[next]; el('liveDot').classList.toggle('on', next === 'playing');
        el('pauseBtn').textContent = next === 'paused' ? '▶' : 'Ⅱ';
        el('pauseBtn').setAttribute('aria-label', next === 'paused' ? '계속하기' : '일시정지');
      }
      function startGame() {
        if (state === 'over' || state === 'ready') resetGame();
        setState('playing'); overlay.hidden = true;
        startedAt = performance.now() - elapsed * 1000; lastTime = performance.now(); dropCounter = 0;
        cancelAnimationFrame(animationId); animationId = requestAnimationFrame(loop);
      }
      function togglePause() {
        if (state === 'playing') {
          elapsed = (performance.now() - startedAt) / 1000; setState('paused');
          showOverlay('TAKE YOUR TIME', '잠깐 쉬어가요', '준비되면 이어서 플레이하세요.', '계속하기');
        } else if (state === 'paused') startGame();
      }
      function endGame() {
        elapsed = (performance.now() - startedAt) / 1000;
        setState('over'); cancelAnimationFrame(animationId);
        showOverlay('GAME OVER', '잘했어요!', `최종 점수 <b style="color:#fff">${score.toLocaleString('ko-KR')}</b>점<br>다시 도전해볼까요?`, '다시 시작');
      }
      function loop(now) {
        if (state !== 'playing') return;
        const dt = now - lastTime; lastTime = now; dropCounter += dt;
        elapsed = (now - startedAt) / 1000; el('time').textContent = formatTime(elapsed);
        if (dropCounter > Math.max(85, 850 * Math.pow(.82, level - 1))) { move(0, 1); dropCounter = 0; }
        draw();
        if (state === 'playing') animationId = requestAnimationFrame(loop);
      }
      function restart() { cancelAnimationFrame(animationId); resetGame(); setState('ready'); showOverlay('READY WHEN YOU ARE', '시작해볼까요?', '블록을 움직여 빈틈없이 쌓고<br>줄을 완성해보세요.', '게임 시작'); el('time').textContent = '00:00'; }
      function action(name) {
        if (name === 'pause') { if (state === 'ready') startGame(); else togglePause(); return; }
        if (state === 'ready') startGame();
        if (state !== 'playing') return;
        if (name === 'left') move(-1, 0);
        if (name === 'right') move(1, 0);
        if (name === 'down') { if (move(0, 1)) { score++; updateStats(); } }
        if (name === 'rotate') rotate();
        if (name === 'drop') hardDrop();
        if (name === 'hold') holdPiece();
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        const handled = ['arrowleft','arrowright','arrowdown','arrowup',' ','c','p','escape','x','z'];
        if (!handled.includes(key)) return;
        event.preventDefault();
        if (key === 'p' || key === 'escape') { togglePause(); return; }
        if (state === 'ready' && key !== 'p') startGame();
        if (state !== 'playing') return;
        if (key === 'arrowleft') move(-1, 0);
        else if (key === 'arrowright') move(1, 0);
        else if (key === 'arrowdown') { if (move(0,1)) { score++; updateStats(); } }
        else if (key === 'arrowup' || key === 'x') rotate();
        else if (key === 'z') { if (current) { current.matrix = rotateMatrix(rotateMatrix(rotateMatrix(current.matrix))); draw(); } }
        else if (key === ' ') hardDrop();
        else if (key === 'c') holdPiece();
      });
      el('startBtn').addEventListener('click', startGame);
      el('pauseBtn').addEventListener('click', () => { if (state === 'ready') startGame(); else togglePause(); });
      el('restartBtn').addEventListener('click', restart);
      document.querySelectorAll('[data-action]').forEach(button => {
        const name = button.dataset.action;
        if (['left','right','down'].includes(name)) {
          let holdTimer, repeatTimer, skipClick = false;
          button.addEventListener('click', () => {
            if (skipClick) { skipClick = false; return; }
            action(name);
          });
          button.addEventListener('pointerdown', (event) => {
            event.preventDefault(); skipClick = true; action(name);
            holdTimer = setTimeout(() => { repeatTimer = setInterval(() => action(name), 85); }, 190);
          });
          const stop = () => { clearTimeout(holdTimer); clearInterval(repeatTimer); setTimeout(() => { skipClick = false; }, 0); };
          button.addEventListener('pointerup', stop); button.addEventListener('pointercancel', stop); button.addEventListener('pointerleave', stop);
        } else button.addEventListener('click', () => action(name));
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });
      resetGame(); setState('ready');
    })();
  </script>
</body>
</html>
